{% extends 'core/base.html' %}
{% block title %}Delete Post{% endblock %}
{% block content %}
<div class="card">
    <h2>Delete Post?</h2>
    <p>"{{ post.content }}"</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, Delete</button>
        <a class="btn" href="{% url 'home' %}">Cancel</a>
    </form>
</div>
{% endblock %}
