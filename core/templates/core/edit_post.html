{% extends 'core/base.html' %}
{% block title %}Edit Post{% endblock %}
{% block content %}
<div class="card">
    <h2>Edit Post</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
        <a class="btn" href="{% url 'home' %}">Cancel</a>
    </form>
</div>
{% endblock %}
